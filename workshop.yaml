name: sphinx-stack-testing
base: ubuntu@24.04
sdks:
  - name: opencode
    channel: latest/stable
  - name: uv
    channel: latest/stable

actions:
  opencode: |
    opencode "$@"
  adoption-test: |
    set -euo pipefail
    sudo apt update
    sudo apt install -y make git rsync python3.12-venv
    rm -rf .agentic-work
    rm -f agentic-test-report.md
    status=0
    opencode run "Follow the attached prompt" --agent sphinx-stack-agent --file .opencode/prompts/sphinx-stack-adoption.md || status=$?
    rm -rf .agentic-work
    exit "$status"
  upgrade-test: |
    set -euo pipefail
    sudo apt update
    sudo apt install -y make git rsync python3.12-venv
    rm -rf .agentic-work
    rm -f agentic-test-report.md
    status=0
    opencode run "Follow the attached prompt" --agent sphinx-stack-agent --file .opencode/prompts/sphinx-stack-upgrade.md || status=$?
    rm -rf .agentic-work
    exit "$status"