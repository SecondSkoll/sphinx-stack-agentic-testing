name: Run adoption test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  adoption-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Workshop
        run: sudo snap install workshop --classic

      - name: Configure OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          umask 077
          printf '%s' "$OPENROUTER_API_KEY" > .key

      - name: Run adoption test
        id: test
        run: |
          set +e
          workshop run -- adoption-test 2>&1 | tee adoption-test-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate concise report
        id: report
        if: always()
        run: |
          set +e
          report=agentic-test-report.md
          valid=true
          for required in \
            'sphinx-stack-adoption-report-v1' \
            '## Release evidence' \
            '## Scenario results' \
            '## Fuzz results' \
            '## Findings' \
            '## Repository state' \
            'local-rst' \
            'reference-generic-agentic-workflows'; do
            grep -Fq "$required" "$report" 2>/dev/null || valid=false
          done
          outcome=$(sed -n 's/^- \*\*Overall outcome:\*\* \(successful\|partially successful\|blocked\)$/\1/p' "$report" | head -n1)
          [[ -n "$outcome" ]] || valid=false
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "outcome=${outcome:-blocked}" >> "$GITHUB_OUTPUT"

      - name: Upload complete test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adoption-test-evidence
          path: |
            agentic-test-report.md
            adoption-test-output.txt
          if-no-files-found: warn

      - name: Create results issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          REPORT_VALID: ${{ steps.report.outputs.valid }}
          OUTCOME: ${{ steps.report.outputs.outcome }}
        run: |
          set -euo pipefail
          status="${OUTCOME:-blocked}"
          if [[ "${EXIT_CODE:-1}" != "0" || "${REPORT_VALID:-false}" != "true" ]]; then
            status="failed"
          fi

          if [[ -f agentic-test-report.md && "${REPORT_VALID:-false}" == "true" ]]; then
            cp agentic-test-report.md issue-body.md
          else
            printf '# Sphinx Stack adoption test\n\n- **Overall outcome:** blocked\n\nThe agent did not produce a valid `sphinx-stack-adoption-report-v1` report. See the workflow artifact for the complete transcript.\n' > issue-body.md
          fi
          printf '\n---\n[Workflow run and complete evidence artifact](%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> issue-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Adoption test: $status ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file issue-body.md

      - name: Mark workflow as failed when blocked or invalid
        if: steps.test.outputs.exit_code != '0' || steps.report.outputs.valid != 'true' || steps.report.outputs.outcome == 'blocked'
        run: exit 1
